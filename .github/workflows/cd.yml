name: cd

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v3"

      - name: "Use gcloud CLI"
        run: "gcloud info"

      - name: "Build image and deploy"
        run: "gcloud builds submit --tag us-central1-docker.pkg.dev/valiant-nucleus-495222-p8/notely-ar-repo/notely:latest ."

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/valiant-nucleus-495222-p8/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project valiant-nucleus-495222-p8 --max-instances=4
